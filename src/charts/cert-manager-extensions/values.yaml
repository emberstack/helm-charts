## cert-manager extensions
## Targets the cert-manager.io/v1 API as shipped with cert-manager v1.21.1
## https://cert-manager.io/docs/reference/api-docs/

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}

## @section Issuer / ClusterIssuer parameters
## NOTE: these two are LISTS (each entry needs its own `name`), unlike `certificates`
## below which is a map keyed by name. Exactly one backend (acme / ca / selfSigned /
## vault / venafi) should be set per entry.
issuers: []
clusterIssuers: []
