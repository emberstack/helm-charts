## Argo CD extensions
## Targets argoproj.io/v1alpha1 as shipped with Argo CD v3.5.1
## https://argo-cd.readthedocs.io/

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}

## Every section is a LIST. Each entry needs its own `name`; the resource is named
## "<release>-<chart>-<name>" unless you set `fullnameOverride`. `namespace` on an
## entry overrides the release namespace — for Argo CD that is usually the namespace
## the Argo CD instance watches (commonly `argocd`).

