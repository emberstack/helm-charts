## @section Application parameters
## Exactly one of `source` or `sources` is required.
applications: []
# - name: my-app                  # required
#   enabled: true
#   fullnameOverride: ""
#   namespace: ""
#   labels: {}
#   annotations: {}
#   finalizers:
#     - resources-finalizer.argocd.argoproj.io
#   project: default
#   source:
#     repoURL: https://github.com/my-org/my-repo
#     path: manifests
#     targetRevision: HEAD
#   # sources: []                  # use instead of `source` for multi-source apps
#   destination:
#     server: https://kubernetes.default.svc   # or use `name:` for a named cluster
#     namespace: my-app
#   syncPolicy:
#     automated:
#       prune: true
#       selfHeal: true
#     syncOptions:
#       - CreateNamespace=true
#   ignoreDifferences: []
#   info: []
#   revisionHistoryLimit: 10
#   ## Source hydrator (Argo CD >= 2.13); mutually exclusive with plain source in practice
#   # sourceHydrator:
#   #   drySource:
#   #     repoURL: https://github.com/my-org/my-repo
#   #     path: manifests
#   #     targetRevision: main
#   #   syncSource:
#   #     path: manifests
#   #     targetBranch: environments/dev
#   #   hydrateTo:
#   #     targetBranch: environments/dev-next
#   ## One-off operation (e.g. trigger a sync)
#   # operation: {}

