{{- range $i, $item := .Values.appProjects }}
{{- if eq (include "common.item.enabled" (dict "item" $item)) "true" }}
{{- $fullName := include "common.names.item.fullname" (dict "item" $item "context" $) }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ include "common.names.item.namespace" (dict "item" $item "context" $) | quote }}
  labels:
    {{- include "common.labels.item" (dict "item" $item "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
  {{- include "common.annotations.render" (dict "annotations" (merge (default dict $item.annotations) (default dict $.Values.commonAnnotations)) "context" $) | nindent 2 }}
{{- $hasSpec := or $item.description (hasKey $item "permitOnlyProjectScopedClusters") }}
{{- $hasSpec = or $hasSpec $item.clusterResourceWhitelist }}
{{- $hasSpec = or $hasSpec $item.clusterResourceBlacklist }}
{{- $hasSpec = or $hasSpec $item.namespaceResourceWhitelist }}
{{- $hasSpec = or $hasSpec $item.namespaceResourceBlacklist }}
{{- $hasSpec = or $hasSpec $item.destinations }}
{{- $hasSpec = or $hasSpec $item.destinationServiceAccounts }}
{{- $hasSpec = or $hasSpec $item.sourceRepos }}
{{- $hasSpec = or $hasSpec $item.sourceNamespaces }}
{{- $hasSpec = or $hasSpec $item.orphanedResources }}
{{- $hasSpec = or $hasSpec $item.syncWindows }}
{{- $hasSpec = or $hasSpec $item.roles }}
{{- $hasSpec = or $hasSpec $item.signatureKeys }}
{{- $hasSpec = or $hasSpec $item.sourceIntegrity }}
{{- if $hasSpec }}
spec:
  {{- with $item.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- if hasKey $item "permitOnlyProjectScopedClusters" }}
  permitOnlyProjectScopedClusters: {{ $item.permitOnlyProjectScopedClusters }}
  {{- end }}
  {{- with $item.clusterResourceWhitelist }}
  clusterResourceWhitelist:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.clusterResourceBlacklist }}
  clusterResourceBlacklist:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.namespaceResourceWhitelist }}
  namespaceResourceWhitelist:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.namespaceResourceBlacklist }}
  namespaceResourceBlacklist:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.destinations }}
  destinations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.destinationServiceAccounts }}
  destinationServiceAccounts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.sourceRepos }}
  sourceRepos:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.sourceNamespaces }}
  sourceNamespaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.orphanedResources }}
  orphanedResources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.syncWindows }}
  syncWindows:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.roles }}
  roles:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.signatureKeys }}
  signatureKeys:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.sourceIntegrity }}
  sourceIntegrity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- else }}
spec: {}
{{- end }}
{{- end }}
{{- end }}
