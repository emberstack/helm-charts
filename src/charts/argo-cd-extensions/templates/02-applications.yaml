{{- range $i, $item := .Values.applications }}
{{- if eq (include "common.item.enabled" (dict "item" $item)) "true" }}
{{- $fullName := include "common.names.item.fullname" (dict "item" $item "context" $) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $fullName | quote }}
  namespace: {{ include "common.names.item.namespace" (dict "item" $item "context" $) | quote }}
  labels:
    {{- include "common.labels.item" (dict "item" $item "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
  {{- include "common.annotations.render" (dict "annotations" (merge (default dict $item.annotations) (default dict $.Values.commonAnnotations)) "context" $) | nindent 2 }}
  {{- with $item.finalizers }}
  finalizers:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  project: {{ $item.project | default "default" | quote }}
  {{- with $item.source }}
  source:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.sources }}
  sources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  destination:
    {{- $dest := default dict $item.destination }}
    {{- if $dest.name }}
    name: {{ $dest.name | quote }}
    {{- else }}
    server: {{ $dest.server | default "https://kubernetes.default.svc" | quote }}
    {{- end }}
    namespace: {{ $dest.namespace | default $.Release.Namespace | quote }}
  {{- with $item.sourceHydrator }}
  sourceHydrator:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.info }}
  info:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if hasKey $item "revisionHistoryLimit" }}
  revisionHistoryLimit: {{ $item.revisionHistoryLimit | int64 }}
  {{- end }}
  {{- with $item.syncPolicy }}
  syncPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with $item.operation }}
operation:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
