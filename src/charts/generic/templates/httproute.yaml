{{- if .Values.httpRoute.enabled }}
apiVersion: {{ include "common.capabilities.httpRoute.apiVersion" . }}
kind: HTTPRoute
metadata:
  name: {{ include "generic.fullname" . }}
  namespace: {{ include "generic.namespace" . }}
  labels:
    {{- include "generic.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.httpRoute.annotations .Values.commonAnnotations) "context" $) | fromYaml }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "common.tplvalues.render" (dict "value" .Values.httpRoute.parentRefs "context" $) | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- /*
  Every HTTPRouteRule field is passed through as given. Only three get defaults:
  backendRefs point at this release's Service, filters are merged with
  httpRoute.extraFilters, and timeouts fall back to httpRoute.timeouts. With no
  rules configured, a single rule made of those defaults is rendered.
  */}}
  {{- $fullName := include "generic.fullname" . }}
  {{- $extraFilters := list }}
  {{- range (default list .Values.httpRoute.extraFilters) }}
  {{- $extraFilters = append $extraFilters (include "common.tplvalues.render" (dict "value" . "context" $) | fromYaml) }}
  {{- end }}
  {{- $rules := list }}
  {{- range (default (list dict) .Values.httpRoute.rules) }}
  {{- $rule := omit . "backendRefs" "filters" "timeouts" }}
  {{- range $key, $value := $rule }}
  {{- if empty $value }}{{ $_ := unset $rule $key }}{{ end }}
  {{- end }}
  {{- $backendRefs := list }}
  {{- range (default (list dict) .backendRefs) }}
  {{- $ref := deepCopy . }}
  {{- range $key, $value := $ref }}
  {{- if or (kindIs "invalid" $value) (eq (toString $value) "") }}{{ $_ := unset $ref $key }}{{ end }}
  {{- end }}
  {{- $_ := set $ref "name" (default $fullName .name) }}
  {{- $_ := set $ref "port" (default $.Values.service.port .port) }}
  {{- $backendRefs = append $backendRefs $ref }}
  {{- end }}
  {{- $_ := set $rule "backendRefs" $backendRefs }}
  {{- with (concat (default list .filters) $extraFilters) }}
  {{- $_ := set $rule "filters" . }}
  {{- end }}
  {{- with (default $.Values.httpRoute.timeouts .timeouts) }}
  {{- $_ := set $rule "timeouts" . }}
  {{- end }}
  {{- $rules = append $rules $rule }}
  {{- end }}
  rules:
    {{- toYaml $rules | nindent 4 }}
{{- if .Values.httpRoute.httpRedirect.enabled }}
---
{{- $redirect := .Values.httpRoute.httpRedirect }}
apiVersion: {{ include "common.capabilities.httpRoute.apiVersion" . }}
kind: HTTPRoute
metadata:
  name: {{ printf "%s-redirect" (include "generic.fullname" .) }}
  namespace: {{ include "generic.namespace" . }}
  labels:
    {{- include "generic.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    {{- with (default .Values.httpRoute.labels $redirect.labels) }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- $redirectAnnotations := include "common.tplvalues.merge" (dict "values" (list (default .Values.httpRoute.annotations $redirect.annotations) .Values.commonAnnotations) "context" $) | fromYaml }}
  {{- with $redirectAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if $redirect.parentRefs }}
    {{- include "common.tplvalues.render" (dict "value" $redirect.parentRefs "context" $) | nindent 4 }}
    {{- else }}
    {{- /* Derive redirect parentRefs from main route, swapping sectionName to "http" */ -}}
    {{- range .Values.httpRoute.parentRefs }}
    - name: {{ .name }}
      sectionName: http
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .group }}
      group: {{ . }}
      {{- end }}
      {{- with .kind }}
      kind: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- $redirectHostnames := default .Values.httpRoute.hostnames $redirect.hostnames }}
  {{- with $redirectHostnames }}
  hostnames:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ $redirect.scheme }}
            statusCode: {{ $redirect.statusCode }}
            {{- if $redirect.port }}
            port: {{ $redirect.port }}
            {{- end }}
            {{- with $redirect.path }}
            path:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
{{- end }}
