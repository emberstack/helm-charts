#         memory: 128Mi
#       max:
#         cpu: "2"
#         memory: 2Gi
#       min:
#         cpu: 10m
#         memory: 32Mi
#       maxLimitRequestRatio: {}

## @section PriorityClass parameters
## Cluster-scoped, scheduling.k8s.io/v1. Use fullnameOverride for an exact name.
priorityClasses: []
